# Japanese (Romaji input) schema for librime.
# Dictionaries: japanese.dict.yaml imports japanese.kana (kana table) and japanese.core (words);
# both are generated by scripts/generate_builtin_dict.py from gkovacs/rime-japanese.
schema:
  schema_id: japanese
  name: 日本語
  version: "1.1"
  author:
    - wetype-multilanguage
  description: |
    Romaji -> kana / kanji input schema with a Mozc-derived dictionary.

switches:
  - name: ascii_mode
    reset: 0
    states: [ あ, A ]
  - name: full_shape
    states: [ 半角, 全角 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ-_'"
  delimiter: "'"
  algebra:
    # The dictionaries are written in Hepburn romaji (shi, chi, tsu, fu, ji, sha, cha, ja). These rules also accept
    # the Kunrei-shiki and common IME spellings typed for the same kana.
    # Keep the list short: every rule runs on every distinct code of the dictionary (one per word), so each rule
    # added here makes the first deploy slower. Small kana (xa, la, xtu, ltu) and the doubled consonants of the
    # sokuon (kka, tte, ssho) are real entries in japanese.kana.dict.yaml and need no rule.
    - derive/shi/si/
    - derive/chi/ti/
    - derive/tsu/tu/
    - derive/fu/hu/
    - derive/ji/zi/
    - derive/sh([auo])/sy$1/
    - derive/ch([auo])/ty$1/
    - derive/j([auo])/zy$1/
    - derive/j([auo])/jy$1/
    # Long vowels left short, the way English texts romanize them (Tokyo, chugoku, ohayo, arigato). Fuzzy, so a word typed in
    # full still ranks first. Dropping all of them, or only the one at the end (toukyo).
    - fuzz/ou/o/
    - fuzz/ou$/o/
    - fuzz/uu/u/
    - fuzz/uu$/u/
    # Triple n for kana starting with n (e.g. konnnichiha -> こんにちは, annnai -> 案内)
    - derive/nn([aiueo])/nnn$1/

translator:
  dictionary: japanese
  enable_sentence: true
  enable_user_dict: true
  enable_encoder: true
  enable_completion: true
  sentence_over_completion: false
  spelling_hints: 0

punctuator:
  half_shape:
    ',': [ 、, "," ]
    '.': [ 。, "." ]
    '/': [ ・, "/" ]
    '[': [ 「, "[" ]
    ']': [ 」, "]" ]
    '-': [ ー, "-" ]
    '~': [ 〜, "~" ]
  full_shape:
    ',': [ 、 ]
    '.': [ 。 ]

key_binder:
  bindings:
    - { when: composing, accept: Tab, send: Page_Down }

menu:
  page_size: 50

recognizer:
  patterns:
    punct: '^/([0-9]+[a-z]*|[a-z]+)$'
